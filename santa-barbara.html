<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Santa Bárbara</title>

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --azul: #0f3b4c;      /* azul petróleo */
            --azul-claro: #e6f2f5;
            --branco: #ffffff;
            --cinza: #f5f5f5;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--cinza);
            margin: 0;
            padding: 0;
        }

        header {
            background: var(--azul);
            color: var(--branco);
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #conteudo {
            padding: 25px;
        }

        #estado {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--azul);
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--branco);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        th {
            background: var(--azul);
            color: var(--branco);
            padding: 12px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: var(--azul-claro);
        }
    </style>
</head>

<body>

<header>
    Recibos — Santa Bárbara
</header>

<div id="conteudo">
    <div id="estado">A carregar dados…</div>

    <table id="tabela">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Mês</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>

async function carregarExcel() {

    const estado = document.getElementById("estado");

    // ⭐ LINK DO GOOGLE DRIVE (DOWNLOAD DIRETO)
    //const EXCEL_URL =
       // "https://

    try {

        estado.innerText = "A descarregar ficheiro…";

        // ⭐ FETCH DO EXCEL
        const resposta = await fetch(EXCEL_URL);
        const arrayBuffer = await resposta.arrayBuffer();

        estado.innerText = "A ler ficheiro…";

        // ⭐ LER EXCEL COM SHEETJS
        const workbook = XLSX.read(arrayBuffer, { type: "array" });

        // ⭐ FOLHA "fichas"
        const folha = workbook.Sheets["fichas"];
        const dados = XLSX.utils.sheet_to_json(folha);

        estado.innerText = "A construir tabela…";

        const tbody = document.querySelector("#tabela tbody");
        tbody.innerHTML = "";

        // ⭐ PREENCHER TABELA
        dados.forEach(linha => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${linha.Nome || ""}</td>
                <td>${linha.Mes || ""}</td>
                <td>${linha.Valor || ""}</td>
            `;

            tbody.appendChild(tr);
        });

        estado.innerText = "Dados carregados com sucesso.";

    } catch (erro) {
        console.error(erro);
        estado.innerText = "Erro ao carregar dados.";
    }
}

carregarExcel();

</script>

</body>
</html>
