<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédios – Gestão de Inquilinos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0A3D46;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .lista-predios {
      background: white;
      color: #0A3D46;
      padding: 20px;
      border-radius: 12px;
      margin: 20px;
    }

    .predio {
      padding: 15px;
      margin-bottom: 10px;
      background: #F2F5F7;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .predio:hover {
      background: #145A67;
      color: white;
    }
  </style>
</head>

<body>
  <header>Gestão de Inquilinos</header>

  <div class="lista-predios">
    <div class="predio">Santa Bárbara</div>
    <div class="predio">Av. Marconi</div>
    <div class="predio">Capitão Roby</div>
    <div class="predio">Vila Paulo Jorge</div>
    <div class="predio">Av. EUA</div>
  </div>
</body>
</html>
