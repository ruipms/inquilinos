<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédios – Gestão de Inquilinos</title>

  <!-- Manifest da PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0A3D46;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .lista-predios {
      background: white;
      color: #0A3D46;
      padding: 20px;
      border-radius: 12px;
      margin: 20px;
    }

    .predio {
      padding: 15px;
      margin-bottom: 10px;
      background: #F2F5F7;
      border-radius: 8px;
      font-size: 18px;
      color: #0A3D46;
      cursor: pointer;
      text-decoration: none;
    }

    .predio:hover {
      background: #145A67;
      color: white;
    }
  </style>
</head>

<body>
  <header>Gestão dos Inquilinos</header>

  <div class="lista-predios">
    <div class="predio" onclick="openPage('santa-barbara.html')">Santa Bárbara</div>
    <div class="predio" onclick="openPage('av-marconi.html')">Av. Marconi</div>
    <div class="predio" onclick="openPage('capitao-roby.html')">Capitão Roby</div>
    <div class="predio" onclick="openPage('vila-paulo-jorge.html')">Vila Paulo Jorge</div>
    <div class="predio" onclick="openPage('av-eua.html')">Av. EUA</div>
  </div>

  <script>
    function openPage(page) {
      window.location.href = page;
    }

    // Registo do Service Worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registado"))
        .catch(err => console.log("Erro ao registar SW:", err));
    }
  </script>

</body>
</html>
